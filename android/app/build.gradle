plugins { id "com.android.application" }

android {
    namespace "in.sahayak.ai"
    compileSdk 34
    defaultConfig {
        applicationId "in.sahayak.ai"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    signingConfigs {
        // Personal app, public repo: a fixed key so new builds install as UPDATES
        // over the old one (only install Sahayak from this repo's release link).
        release {
            storeFile file("release.jks")
            storePassword "sahayakapp"
            keyAlias "sahayak"
            keyPassword "sahayakapp"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.fragment:fragment:1.3.6"
    implementation "androidx.core:core:1.6.0"
}
